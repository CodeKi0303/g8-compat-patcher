name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build and install Python package
        run: python -m pip install --no-deps .
      - name: Check installed package resources
        working-directory: ${{ runner.temp }}
        run: g8-compat-patcher profiles
      # Firmware downloads and generated firmware are intentionally absent from CI.
